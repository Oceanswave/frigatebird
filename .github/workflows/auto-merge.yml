name: PR auto-merge (green CI)
# Same-repo PRs that pass CI are squash-merged. Runs from the default branch via
# workflow_run and calls the shared merge helper, which re-checks draft, reviews,
# unresolved threads, and that every check on the exact head is green before
# squash-merging. Fork PRs are never merged here.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: read
jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    uses: Oceanswave/github-workflows/.github/workflows/merge.yml@6cdca8dfad892359b266326b6f74ba012418dac4 # main
    with:
      runs-on: '["ubuntu-latest"]'
      head-branch: ${{ github.event.workflow_run.head_branch }}
      expected-head: ${{ github.event.workflow_run.head_sha }}
      required-checks: '[{"name":"Lint Build Test","appId":15368}]'
